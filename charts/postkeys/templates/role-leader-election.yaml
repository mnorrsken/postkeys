{{- if .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "postkeys.fullname" . }}-leader-election
  labels:
    {{- include "postkeys.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "postkeys.fullname" . }}-leader-election
  labels:
    {{- include "postkeys.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "postkeys.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "postkeys.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
