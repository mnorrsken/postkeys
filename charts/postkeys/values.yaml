# Default values for postkeys
replicaCount: 1

image:
  repository: ghcr.io/mnorrsken/postkeys
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 6379

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Graceful shutdown configuration
gracefulShutdown:
  # Seconds to sleep in preStop hook before SIGTERM is processed.
  # Allows kube-proxy time to remove endpoints before the pod starts
  # refusing connections. Typical values: 3-5 seconds.
  preStopSleepSeconds: 5

# Enable debug logging (sets DEBUG=1)
debug: false

# SQL query tracing level (sets SQLTRACE=0-3)
# 0 = off (default)
# 1 = important only (DDL, TRUNCATE, errors)
# 2 = most queries (INSERT, UPDATE, DELETE)
# 3 = everything (including SELECT)
# WARNING: Higher levels output more queries to logs - use only for debugging
sqlTraceLevel: 0

# RESP command tracing level (sets TRACE=0-3)
# 0 = off (default)
# 1 = important only (AUTH, FLUSHDB, CONFIG, CLUSTER)
# 2 = most commands (excludes GET, SET, and other high-frequency commands)
# 3 = everything (including GET, SET, HGET, HSET, etc.)
# WARNING: Higher levels output more commands to logs - use only for debugging
traceLevel: 0

# Leader election — when enabled, one instance acquires a PostgreSQL advisory lock
# and labels its own pod with postkeys/role=leader. The Service selector includes
# this label so traffic routes exclusively to the leader, ensuring cache coherency.
# All pods remain ready (TCP probe), so Deployments and ArgoCD report healthy.
# Requires serviceAccount.create=true (creates RBAC for pod label patching).
leaderElection:
  enabled: false

# Redis server configuration
redis:
  # Address to listen on (inside the container)
  addr: ":6379"
  
  # Redis password configuration
  password:
    # Enable creation of a Redis password secret using a Helm hook Job
    # If enabled and no existingSecret is provided, a random password will be generated
    # The password.value field is ignored when create is true
    create: false
    # Name of the secret to create (only used if create is true and no existingSecret)
    secretName: "postkeys-secret"
    # Password value (only used if create is false and no existingSecret is set)
    # When create is true, this value is ignored and a random password is generated
    value: ""
    # Secret generator Job configuration (only used when create is true)
    secretGenerator:
      # Image configuration for the secret generator Job
      image:
        repository: rancher/kubectl
        tag: "v1.35.0"
        pullPolicy: IfNotPresent
    # Use an existing secret for the Redis password
    existingSecret:
      # Name of the existing secret
      name: ""
      # Key in the secret containing the password
      key: "redis-password"

# PostgreSQL connection configuration
postgresql:
  # PostgreSQL host
  host: "postgresql"
  # PostgreSQL port
  port: 5432
  # PostgreSQL database name
  database: "postkeys"
  # PostgreSQL SSL mode (disable, require, verify-ca, verify-full)
  sslmode: "disable"
  
  # Connection pool configuration for improved resilience during failovers
  pool:
    # Maximum number of connections in the pool
    maxConns: 10
    # Minimum number of connections to maintain in the pool
    minConns: 2
    # Maximum lifetime of a connection before it's closed and recreated
    # This ensures connections are refreshed during database switchovers
    maxConnLifetime: "30m"
    # Maximum time a connection can be idle before it's closed
    maxConnIdleTime: "5m"
    # Period between health checks on idle connections
    # Helps detect and remove stale connections
    healthCheckPeriod: "1m"
  
  # Use an existing secret for PostgreSQL credentials
  existingSecret:
    # Name of the existing secret
    name: ""
    # Key in the secret containing the username (optional)
    usernameKey: ""
    # Key in the secret containing the password
    passwordKey: "password"
    # Key in the secret containing the host (optional)
    hostKey: ""
    # Key in the secret containing the port (optional)
    portKey: ""
    # Key in the secret containing the database name (optional)
    databaseKey: ""
  
  # Authentication configuration
  auth:
    # PostgreSQL username (ignored if existingSecret provides it)
    username: "postgres"
    # PostgreSQL password (ignored if existingSecret is set)
    password: ""

# Additional environment variables
extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"

# Additional environment variables from secrets/configmaps
extraEnvFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-configmap

# Grafana dashboard provisioning. Renders a ConfigMap that the Grafana
# sidecar (e.g. kiwigrid/k8s-sidecar) discovers via labelSelector and imports.
# The dashboard JSON lives at charts/postkeys/dashboards/postkeys.json and is
# embedded verbatim — edit that file and re-render to update.
grafana:
  dashboard:
    # Disabled by default. Set to true if you run Grafana with the dashboard
    # sidecar enabled and want this dashboard provisioned automatically.
    enabled: false
    # Namespace to render the ConfigMap into. Defaults to the release namespace.
    namespace: ""
    # Label the sidecar matches on. Defaults align with the Grafana Helm chart
    # default (sidecar.dashboards.label / labelValue).
    labelKey: grafana_dashboard
    labelValue: "1"
    # Annotation the sidecar reads to place the dashboard in a Grafana folder.
    # Leave folder empty to use the root folder.
    folderAnnotation: grafana_folder
    folder: ""
    # Additional labels / annotations to add to the ConfigMap.
    extraLabels: {}
    extraAnnotations: {}

# Prometheus alerting rules (PrometheusRule CRD). Requires prometheus-operator.
# All rules are disabled by default; toggle individually under rules:*.enabled.
prometheusRule:
  # Master switch — when false the CRD is not rendered at all.
  enabled: false
  # Namespace to render the PrometheusRule into. Defaults to release namespace.
  namespace: ""
  # Labels on the PrometheusRule CR itself. Prometheus operators usually filter
  # rule pickup with something like `release: prometheus` — add that here.
  labels: {}
  # Labels applied to every alert in the rule group (severity, team, etc).
  alertLabels:
    severity: warning
  # Annotations merged into every alert (runbook URLs, dashboards, etc).
  annotations: {}
  # Rule group evaluation interval. Empty = use Prometheus default.
  interval: ""
  # Per-alert tuning. Each rule can be disabled or have thresholds/`for`
  # tuned. Add `labels:` to a rule to override the group's alertLabels for
  # that one alert (e.g. raise severity: critical).
  rules:
    podDown:
      enabled: true
      for: 5m
    highErrorRate:
      enabled: true
      # Fraction of commands returning an error, sustained for `for`.
      threshold: 0.05
      for: 10m
    highLatencyP99:
      enabled: true
      # p99 command latency in seconds, sustained for `for`. Blocking
      # commands matching excludeCommands are excluded — they're slow by
      # design and are covered by stuckBlockingCalls instead.
      threshold: 0.1
      excludeCommands: "BRPOP|BLPOP"
      for: 10m
    stuckBlockingCalls:
      enabled: true
      # Average concurrent blocking calls per pod (seconds-waited per
      # second). Climbing without traffic growth usually means
      # LISTEN/NOTIFY broke and clients are hitting the poll fallback.
      commands: "BRPOP|BLPOP"
      threshold: 50
      for: 15m
    lowCacheHitRate:
      # Only meaningful when cache.enabled=true. Off by default.
      enabled: false
      # Percent (0-100).
      threshold: 50
      # Skip pods that aren't actually serving cache traffic, to avoid
      # alerting on dev/idle replicas.
      minTrafficOps: 1
      for: 30m
  # Free-form list of extra rule entries appended to the group. Each item
  # is a full Prometheus alerting rule (alert, expr, for, labels, annotations).
  extraRules: []

# Metrics configuration
metrics:
  # Enable metrics endpoint
  enabled: true
  # Metrics server address (inside the container)
  addr: ":9090"
  
  # Metrics service configuration
  service:
    # Port for the metrics service
    port: 9090
    # Annotations for the metrics service
    annotations: {}
  
  # ServiceMonitor configuration (requires Prometheus Operator)
  serviceMonitor:
    # Enable ServiceMonitor creation
    enabled: false
    # Namespace for the ServiceMonitor (defaults to release namespace)
    namespace: ""
    # Labels to add to the ServiceMonitor
    labels: {}
    # Interval at which metrics should be scraped
    interval: "30s"
    # Timeout for scraping metrics
    scrapeTimeout: "10s"
    # Metric relabel configs
    metricRelabelings: []
    # Relabel configs
    relabelings: []
    # Honor labels
    honorLabels: false

# Blocking command tuning (BLPOP / BRPOP)
blocking:
  # Fallback poll interval when no LISTEN/NOTIFY notifier is wired up.
  # Ignored on the notify path (which is the default in this chart).
  # Lower values reduce worst-case wakeup latency; higher values reduce DB load.
  # Default matches the in-code default (100ms).
  pollInterval: "100ms"

# Cache configuration (for string GET operations)
cache:
  # Enable in-memory cache (opt-in, disabled by default)
  enabled: false
  # Cache TTL - how long to cache values (e.g., "100ms", "1s", "5s")
  # With distributed invalidation, longer TTLs are safe and improve performance
  # Without distributed invalidation, use shorter TTLs (100-500ms) to limit stale reads
  ttl: "250ms"
  # Maximum number of cached entries (0 = unlimited)
  maxSize: 10000
  # Enable distributed cache invalidation via PostgreSQL LISTEN/NOTIFY
  # Required for cache coherency in multi-pod deployments
  # Adds ~0.3ms overhead per write operation
  # For single-pod deployments, leave disabled and use short TTL
  distributedInvalidation: false
  # Comma-separated key patterns to never cache (glob-style, e.g., "pubsub:*,lock:*")
  excludePatterns: ""
  # Comma-separated key patterns to always cache (overrides exclusions, e.g., "static:*")
  includePatterns: ""
