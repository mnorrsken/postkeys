name: Build and Publish
run-name: Build and Publish ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  integration-test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testingpassword
        ports:
          - 5789:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL integration tests
        run: go test -race -v -tags=postgres ./tests/...
        env:
          PG_HOST: localhost
          PG_PORT: 5789
          PG_USER: postgres
          PG_PASSWORD: testingpassword
          PG_DATABASE: postgres
          PG_SSLMODE: disable

  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: integration-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    outputs:
      primary-tag: ${{ steps.primary.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resolve primary image ref for scanning
        id: primary
        run: |
          # Use the first tag (full semver, e.g. ghcr.io/owner/repo:1.2.3) as the scan target.
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'

  helm:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    needs: integration-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.tag }}/" charts/postkeys/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.tag }}\"/" charts/postkeys/Chart.yaml

      - name: Lint chart
        run: helm lint charts/postkeys

      - name: Package chart
        run: |
          mkdir -p .helm-packages
          helm package charts/postkeys -d .helm-packages

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI registry
        run: |
          for pkg in .helm-packages/*.tgz; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-and-push, helm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target##*/}"
            out="dist/postkeys_${VERSION_NO_V}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/server
          done

      - name: Compute sha256 checksums
        working-directory: dist
        run: |
          sha256sum postkeys_* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"

          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "## Docker Image
          \`\`\`
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_NO_V}
          \`\`\`

          ## Helm Chart
          \`\`\`
          helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/postkeys --version ${VERSION_NO_V}
          \`\`\`

          ## Binaries
          Verify with \`sha256sum -c checksums.txt\` — checksums attached below." \
            dist/postkeys_* dist/checksums.txt
