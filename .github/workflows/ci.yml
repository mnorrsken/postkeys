name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m --build-tags=postgres,redis

  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testingpassword
          POSTGRES_DB: postkeys_ci
        ports:
          - 5789:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postkeys_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: PostgreSQL internal regression tests
        run: go test -race -tags=postgres ./internal/...
        env:
          PG_HOST: localhost
          PG_PORT: 5789
          PG_USER: postgres
          PG_PASSWORD: testingpassword
          PG_DATABASE: postkeys_ci
          PG_SSLMODE: disable

      - name: RESP fuzz smoke (30s)
        run: go test -run=^$ -fuzz=FuzzReader -fuzztime=30s ./internal/resp/
