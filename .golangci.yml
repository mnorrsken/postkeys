run:
  timeout: 5m
  build-tags:
    - postgres
    - redis

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - gosec
    - revive
    - gofmt

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
        arguments:
          - disableStutteringCheck
      - name: unused-parameter
        disabled: true
      - name: unexported-return
        disabled: true
  gosec:
    excludes:
      # G104: Errors unhandled — covered by errcheck.
      - G104
      # G115: Integer overflow on conversions — many false positives where
      # bounded inputs (pool sizes, attempt counts, hash bucket indices) are
      # converted between numeric types. Re-enable case-by-case if a real
      # truncation risk surfaces.
      - G115
      # G401/G505: SHA1 / weak crypto — required by Redis SCRIPT LOAD which
      # specifies SHA1 digests as the script identifier.
      - G401
      - G505
      # G404: math/rand — RANDOMKEY / HRANDFIELD / SRANDMEMBER / ZRANDMEMBER
      # are intentionally non-cryptographic.
      - G404

issues:
  exclude-rules:
    # Test files use a lot of intentional unchecked errors and weaker patterns,
    # and exercise deprecated-but-still-supported go-redis APIs on purpose
    # (e.g. ZRangeByLex, RPopLPush) to confirm wire compatibility.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - revive
    - path: _test\.go
      text: "SA1019:"
      linters:
        - staticcheck
